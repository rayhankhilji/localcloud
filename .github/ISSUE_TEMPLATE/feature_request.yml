name: Feature request
description: Suggest an idea or an improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! localcloud aims to stay small: plain JS, one dependency, no build step.
        The best requests start from a concrete problem.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation. For example, "In Devin, I need to … but localcloud …"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
      description: The command, flag, behavior or output you have in mind.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Workarounds you use today, or how other tools handle this.
    validations:
      required: false

  - type: dropdown
    id: platform
    attributes:
      label: Which environment is this mostly about?
      multiple: true
      options:
        - Claude Code on the web
        - OpenAI Codex (cloud)
        - Cursor background agents
        - Devin
        - Google Jules
        - GitHub Copilot coding agent
        - Replit
        - Codespaces / Gitpod / devcontainers
        - Local machine
        - Running a relay
        - All of them
    validations:
      required: false

  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd be willing to open a pull request for this.
          required: false
