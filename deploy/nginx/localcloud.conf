# nginx in front of a localcloud relay listening on 127.0.0.1:8080.
# Full guide: docs/self-hosting.md#nginx
#
# Drop into /etc/nginx/conf.d/ (it contains `map` and `upstream`, which must sit
# in the http {} context — conf.d/ files are included there), replace
# tunnel.example.com, then:  sudo nginx -t && sudo systemctl reload nginx
#
# The certificate must cover tunnel.example.com AND *.tunnel.example.com. Wildcards need the
# DNS challenge, e.g.:
#   certbot certonly --dns-cloudflare --dns-cloudflare-credentials ~/.cf.ini \
#     -d tunnel.example.com -d '*.tunnel.example.com'

# WebSocket upgrade when asked, otherwise an empty Connection header so
# upstream keep-alive works.
map $http_upgrade $localcloud_connection {
    default upgrade;
    ''      '';
}

upstream localcloud_relay {
    server 127.0.0.1:8080;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name tunnel.example.com *.tunnel.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # nginx >= 1.25.1; on older versions use `listen 443 ssl http2;` instead.
    http2 on;
    server_name tunnel.example.com *.tunnel.example.com;

    ssl_certificate     /etc/letsencrypt/live/tunnel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tunnel.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Requests to tunnels carry whatever the dev server accepts (uploads etc.);
    # the relay itself caps long-poll uploads at 64 MB.
    client_max_body_size 100m;

    location / {
        proxy_pass http://localcloud_relay;
        proxy_http_version 1.1;

        # WebSockets: agents connect with one, and dev servers use them for HMR.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $localcloud_connection;

        # The relay routes on Host (<id>.tunnel.example.com) and builds URLs from
        # X-Forwarded-Proto, so both must be passed through untouched.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Host  $host;

        # Long polls, streaming responses and server-sent events must not be
        # buffered, or nothing reaches the other side until they complete.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;

        # Comfortably longer than the relay's 15 s long poll / 20 s ping, and
        # long enough for idle HMR sockets.
        proxy_connect_timeout 10s;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
    }
}
